[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirdexx"
version = "0.2.0"
description = "Local-first artifact and media intelligence foundation"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mirdexx-media = "mirdexx.media_intelligence.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
